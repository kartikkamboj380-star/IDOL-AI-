services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      KAVRON_ENV: ${KAVRON_ENV:-development}
      KAVRON_DATA_DIR: /app/data
      KAVRON_DATABASE_PATH: /app/data/kavron.sqlite3
      DATABASE_URL: ${DATABASE_URL:-}
      KAVRON_DB_POOL_MIN_SIZE: ${KAVRON_DB_POOL_MIN_SIZE:-1}
      KAVRON_DB_POOL_MAX_SIZE: ${KAVRON_DB_POOL_MAX_SIZE:-10}
      KAVRON_MAX_ACTIVE_JOBS_PER_USER: ${KAVRON_MAX_ACTIVE_JOBS_PER_USER:-5}
      KAVRON_SESSION_SECRET: ${KAVRON_SESSION_SECRET:?Set KAVRON_SESSION_SECRET in .env}
      KAVRON_ENCRYPTION_KEY: ${KAVRON_ENCRYPTION_KEY:-}
      KAVRON_PUBLIC_ORIGIN: ${KAVRON_PUBLIC_ORIGIN:-http://localhost:8080}
      KAVRON_ALLOWED_ORIGINS: ${KAVRON_ALLOWED_ORIGINS:-http://localhost:8080}
      KAVRON_COOKIE_SECURE: ${KAVRON_COOKIE_SECURE:-false}
      KAVRON_ALLOW_REGISTRATION: ${KAVRON_ALLOW_REGISTRATION:-true}
      KAVRON_BOOTSTRAP_ADMIN_EMAIL: ${KAVRON_BOOTSTRAP_ADMIN_EMAIL:-}
      KAVRON_REQUIRE_EMAIL_VERIFICATION: ${KAVRON_REQUIRE_EMAIL_VERIFICATION:-false}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - kavron-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "${KAVRON_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kavron}
      POSTGRES_USER: ${POSTGRES_USER:-kavron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD when using the postgres profile}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  kavron-data:
  postgres-data:
