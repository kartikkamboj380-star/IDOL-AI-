# Fly.io deployment.
#
#   fly launch --no-deploy --copy-config   # creates the app, keep this file
#   fly volume create idol_data --size 1 --region <your-region>
#   fly secrets set GITHUB_TOKEN=...       # optional
#   fly deploy
#
# Keep exactly one machine: the index is built per process, and multiple
# replicas pointed at one volume would duplicate work without sharing memory.
app = "idol-ai"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  IDOL_DATA_DIR = "/app/.data"
  IDOL_LOCAL_DIR = "/app/huggingface"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  grace_period = "40s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[mounts]]
  source = "idol_data"
  destination = "/app/.data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
