name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # The index derives a default repository from the git remote, and the
          # UI tests exercise real file reads; a full checkout keeps both honest.
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (server + web)
        run: npm run typecheck

      - name: Test (engines, HTTP API, UI)
        run: npm test

      - name: Build (SPA + server)
        run: npm run build && npm run build:server

      - name: Smoke-test the built server
        run: |
          set -euo pipefail
          PORT=8788 NODE_ENV=production IDOL_DATA_DIR=.ci-data \
            node --enable-source-maps dist-server/server/index.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8788/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8788/api/health
          echo
          # End-to-end journey check against the compiled server.
          npx tsx scripts/verify-journey.ts http://127.0.0.1:8788
