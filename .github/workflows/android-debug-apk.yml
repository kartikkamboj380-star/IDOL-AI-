name: Android debug APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'HTTPS origin of the deployed KAVRON web app (leave blank for UI shell; backend features need a server)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build web assets and sync native project
        env:
          KAVRON_ANDROID_SERVER_URL: ${{ inputs.server_url }}
        run: npm run android:sync
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kavron-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
